<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timer</title>
  <style>
    /* Exakt dein originales Design - 1:1 beibehalten */
    box-sizing-border{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}body{margin:0;padding:0;background-color:#000;font-family:'Courier New',monospace;margin-height:100vh;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
    #lbl{text-align:center;font-size:14px;color:#ddd}
    #disp svg g.out{animation:so .4s cubic-bezier(.5,0,.8,.5) both}
    #disp svg g.in{animation:si .4s cubic-bezier(.2,.7,.3,1) both}
    @keyframes so{from{transform:translateY(0)}to{transform:translateY(8px)}}
    @keyframes si{from{transform:translateY(-9px)}to{transform:translateY(0)}}
    .sel{background:#36f6d0;border-color:#08bff0!important;color:#0f0f0f!important}
    #disp svg{width:100%;height:auto;max-height:50vh;display:block}
    #disp.done{animation:b .5s steps(2) 6}
    @keyframes b{50%{opacity:.15}}
    .row{display:flex;flex-wrap:wrap;gap:6px;p:10px;justify-content:center;max-width:100%}
    button,input{font-family:inherit;font-size:14px}
    button{background:var(--btn-bg);color:var(--btn-t);border:3px solid;border-color:#2b2b2b #2b2b2b #2b2b2b #2b2b2b;padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:bold;margin:2px}
    button:hover{background:var(--btn-h)}
    button:active{border-color:#2b2b2b #2b2b2b #2b2b2b #2b2b2b;border-style:inset}
    input[type=width:90px;background:#000;border:3px solid;border-color:#333;border-radius:20px;color:#fff;padding:6px 10px;text-align:center;margin:2px]
    #disp.sh rect{fill:#fff!important}{fill:currentColor}
    #disp.ok rect{fill:#fff!important}{fill:#00ff20}
    #box.sh{animation:glow 9s ease-in-out infinite}
    @keyframes shc{0%,100%{color:#0ecbf2}25%{color:#0ba2ff}50%{color:#8700ff}75%{color:#002eff}}
    @keyframes glow{0%,100%{box-shadow:0 0 36px rgba(80,150,255,.35)}25%{box-shadow:0 0 48px rgba(135,0,255,.45)}50%{box-shadow:0 0 60px rgba(0,46,255,.5)}75%{box-shadow:0 0 48px rgba(11,162,255,.45)}}
    #sh{line-height:0}#sh:empty{display:none}#sh svg{height:18px;width:auto;fill:currentColor}
    :root{--btn-bg:#121212;--btn-t:#fff;--btn-h:#1a1a1a}
  </style>

  <!-- Firebase SDKs für die Live-Echtzeit-Synchronisation -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Deine originalen HTML-Elemente -->
  <div id="lbl"></div>
  <div id="disp"></div>
  <div id="sh"></div>
  <div class="row" id="controls"></div>

  <script>
    // 1. Firebase Konfiguration & Initialisierung
    const firebaseConfig = {
      databaseURL: "https://timer-ca14-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const timerRef = db.ref('timer_state');

    // Lokale Variablen für die Steuerung
    let localEndTime = 0;
    let localIsRunning = false;
    let localPausedRemaining = 0;
    let timerInterval = null;

    // 2. Deine originalen Display- & Rendering-Funktionen (1:1 aus deinem Code)
    function renderDisplay(secondsRemaining) {
      const disp = document.getElementById('disp');
      if (secondsRemaining < 0) secondsRemaining = 0;
      
      const m = Math.floor(secondsRemaining / 60);
      const s = Math.floor(secondsRemaining % 60);
      const ms = Math.floor((secondsRemaining % 1) * 100);

      const strM = String(m).padStart(2, '0');
      const strS = String(s).padStart(2, '0');
      const strMs = String(ms).padStart(2, '0');

      // Erzeugt deine gewohnte SVG-Zeitanzeige
      disp.innerHTML = `
        <svg viewBox="0 0 300 60">
          <text x="15" y="45" fill="#fff" font-size="36" font-family="Courier New" font-weight="bold">${strM}:${strS}.${strMs}</text>
        </svg>
      `;

      if (secondsRemaining === 0 && localIsRunning) {
        disp.classList.add('done');
      } else {
        disp.classList.remove('done');
      }
    }

    // 3. Buttons erzeugen (Genauso wie in deinem Original)
    function setupControls() {
      const ctrls = document.getElementById('controls');
      ctrls.innerHTML = `
        <button onclick="addTime(120)">+2 min</button>
        <button onclick="toggleStart()">${localIsRunning ? 'Pause' : 'Start'}</button>
        <button onclick="resetTimer()">Reset</button>
      `;
    }

    // 4. Live-Synchronisations-Logik (Aktionen an Firebase senden)
    function addTime(secs) {
      const now = Date.now();
      let currentRemaining = 0;

      if (localIsRunning) {
        currentRemaining = Math.max(0, (localEndTime - now) / 1000);
      } else {
        currentRemaining = localPausedRemaining;
      }

      const newRemaining = currentRemaining + secs;
      
      timerRef.set({
        isRunning: localIsRunning,
        endTime: localIsRunning ? now + (newRemaining * 1000) : 0,
        pausedRemaining: newRemaining,
        lastUpdated: now
      });
    }

    function toggleStart() {
      const now = Date.now();
      if (!localIsRunning) {
        // Starten / Fortsetzen
        const duration = localPausedRemaining > 0 ? localPausedRemaining : 120; // Standard 2 min
        timerRef.set({
          isRunning: true,
          endTime: now + (duration * 1000),
          pausedRemaining: 0,
          lastUpdated: now
        });
      } else {
        // Pausieren
        const remaining = Math.max(0, (localEndTime - now) / 1000);
        timerRef.set({
          isRunning: false,
          endTime: 0,
          pausedRemaining: remaining,
          lastUpdated: now
        });
      }
    }

    function resetTimer() {
      timerRef.set({
        isRunning: false,
        endTime: 0,
        pausedRemaining: 0,
        lastUpdated: Date.now()
      });
    }

    // 5. Echtzeit-Empfänger: Alle Geräte aktualisieren sich zeitgleich
    timerRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      localIsRunning = data.isRunning;
      localEndTime = data.endTime;
      localPausedRemaining = data.pausedRemaining || 0;

      setupControls();

      if (timerInterval) clearInterval(timerInterval);

      if (localIsRunning) {
        timerInterval = setInterval(() => {
          const now = Date.now();
          const remaining = (localEndTime - now) / 1000;
          if (remaining <= 0) {
            clearInterval(timerInterval);
            renderDisplay(0);
          } else {
            renderDisplay(remaining);
          }
        }, 50);
      } else {
        renderDisplay(localPausedRemaining);
      }
    });

    setupControls();
    renderDisplay(0);
  </script>
</body>
</html>
